[project]
name = "aik08-readonly-agent"
version = "1.0.0"
description = "AIK-08: Hệ thống điều phối agent tra cứu nhiều nguồn ở chế độ read-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-timeout>=2.3,<3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
addopts = "-q"
markers = [
    "postgres: cần một máy chủ PostgreSQL (đặt TEST_POSTGRES_ADMIN_URL), tự bỏ qua nếu không có",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: chuỗi/tài liệu tiếng Việt dài là văn xuôi; ruff format đã lo phần mã.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
